plugins {
    id 'com.android.library'
    id 'maven-publish'
}

/**
 * 统一在模块内显式维护版本，是为了避免 JitPack 发布阶段动态改源码，导致 tag、源码与产物版本发生漂移。
 */
version = "5.0.4"

/**
 * 这里显式声明发布坐标，是为了让 showlog 与底层 netbare-core 的 POM 依赖保持可预测，便于 JitPack 和本地 Maven 一致解析。
 */
def PUBLISH_GROUP_ID = "com.xq.showlog"
def PUBLISH_ARTIFACT_ID = "showlog"
android {
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35

//        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.xq.dialoglogshow'

    /**
     * 这里补 sourcesJar，是为了让 JitPack 与内部仓库都能拿到更完整的 Maven 构件，排查宿主接入问题更方便。
     */
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation project(path: ':netbare-core')
//    implementation 'com.google.android.material:material:1.6.1'
}

afterEvaluate {
    // 这里继续沿用 afterEvaluate，是为了确保 Android release component 已经创建完成，避免发布阶段拿不到组件。
    group = PUBLISH_GROUP_ID
    // 这里直接使用源码中声明的版本，是为了确保 Git tag、源码版本与实际发布产物保持一一对应。
    version = project.version

    publishing {
        publications {
            release(MavenPublication) {
                from this.components.findByName("release")
                // 这里显式写坐标，是为了避免 project 名称或 JitPack 默认坐标变化时影响宿主依赖入口。
                groupId = PUBLISH_GROUP_ID
                artifactId = PUBLISH_ARTIFACT_ID
                version = project.version
            }
        }
    }
    // 这里保留统一依赖 assemble，是为了兼容现有发布任务入口，避免手工区分 release/debug 构建导致漏产物。
    tasks.forEach {
        if(it.name.startsWith("publish")){
            it.dependsOn("assemble")
        }
    }
}
